# Runs on `git commit`, so problems are caught before they reach CI.
# Install once per clone:  uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Data and model binaries do not belong in git history; once committed
        # they stay in the history forever and bloat every future clone.
        args: [--maxkb=1000]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      # Strips notebook outputs before commit. Without this, every rerun shows
      # up as a huge meaningless diff and reviews become impossible.
      - id: nbstripout
